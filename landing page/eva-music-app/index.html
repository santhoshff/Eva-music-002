:root{
  color-scheme:dark;
  --bg:#000; --ink:#e9ebed; --ink-2:#a8afb5; --ink-3:#6e767d; --ink-hi:#fff;
  --s1:#0f1113; --s2:#171a1d; --s3:#212529; --s4:#2c3135;
  --hdr-a:#323438; --hdr-b:#0e0f10; --navbg:#14171a; --sheetbg:#0b0c0e; --wash2:#05080b;
  --hair:#ffffff14; --press:#ffffff0d; --g1:rgba(255,255,255,.07); --g2:rgba(255,255,255,.1); --g3:rgba(255,255,255,.18);
  --glassbg:rgba(40,46,52,.42); --glassline:rgba(255,255,255,.16); --sw-off:#8b9298; --shadow:rgba(0,0,0,.6);
  --acc:#c6dce9; --on-acc:#0c2431; --acc-c:#2b4659; --on-acc-c:#d5eaf8; --track:#2b2d3a;
  --line:rgba(255,255,255,.14);
  --f:"GSFlex",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --band:var(--hdr-a);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-variation-settings:"wdth" 102,"ROND" 20;font-size:14px;line-height:1.3;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
img{display:block}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg)}
@media(min-width:520px){#app{border-inline:1px solid var(--hair)}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:190px;transition:transform .34s var(--ease),opacity .3s;scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen.enter{transform:translateX(100%)}
.screen.out{transform:translateX(100%);pointer-events:none}
.screen.fade{opacity:0}

/* type */
.wordmark{margin:0;display:flex;align-items:center;gap:8px;min-width:0;font-size:25px;line-height:1;font-weight:760;font-variation-settings:"wdth" 124,"ROND" 55;letter-spacing:-.01em;white-space:nowrap}

.splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .55s,visibility 0s .55s}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash img{width:min(74%,320px);height:auto;animation:logoIn .9s var(--spring) both}
@keyframes logoIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.title{margin:0;font-size:30px;line-height:1.05;font-weight:720;font-variation-settings:"wdth" 122,"ROND" 50;letter-spacing:-.01em}
.h2{margin:0;font-size:25px;font-weight:620;font-variation-settings:"wdth" 114,"ROND" 40}
.sub{color:var(--ink-2);font-size:15px;font-weight:480}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--hdr-a),var(--hdr-b));border-radius:0 0 32px 32px;padding-top:22px;padding-bottom:20px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hdr-act{display:flex;gap:10px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.ibtn.lg{width:52px;height:52px;background:var(--s3)}
.ibtn.ghost{background:rgba(0,0,0,.38);color:#fff;backdrop-filter:blur(10px)}
.avatar{width:44px;height:44px;border-radius:50%;padding:2px;background:conic-gradient(var(--acc),var(--acc-c),var(--acc));flex:none}
.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--s2);font-weight:700;font-size:16px;font-variation-settings:"wdth" 110,"ROND" 60}
.back-row{display:flex;align-items:center;gap:14px}
.back-row .title{font-size:26px;font-weight:600;color:var(--ink)}

/* home */
.chips{display:flex;justify-content:space-between;gap:10px;margin:18px 0 16px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border-radius:18px;padding:10px 16px;font-size:17px;font-weight:600;font-variation-settings:"wdth" 108,"ROND" 50;min-width:0}
.pill .ic{width:22px;height:22px}
.daily{margin:0 16px 16px;background:var(--s1);border-radius:30px;padding:16px 0 14px;overflow:hidden}
.daily-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px 14px}
.daily-head h2{margin:3px 0 0;font-size:23px;font-weight:650;letter-spacing:-.02em}
.daily-kicker{color:var(--ink-2);font-size:11px;font-weight:700;letter-spacing:.1em}
.daily-nav{display:flex;gap:8px;flex:none}
.daily-nav .ibtn{width:40px;height:40px;background:var(--s2)}
.daily-rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
.daily-rail::-webkit-scrollbar{display:none}
.daily-card{display:flex;align-items:center;gap:12px;flex:none;width:min(78vw,300px);min-height:114px;padding:10px;border:0;border-radius:22px;background:var(--s2);color:var(--ink);text-align:left;cursor:pointer;scroll-snap-align:start}
.daily-art{position:relative;width:96px;height:96px;flex:none}
.daily-art img{width:100%;height:100%;object-fit:cover;border-radius:16px;background:var(--s3)}
.daily-art span{position:absolute;right:6px;bottom:6px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--acc);color:var(--on-acc)}
.daily-art .ic{width:18px;height:18px}
.daily-copy{display:grid;gap:6px;min-width:0}
.daily-copy b,.daily-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daily-copy b{font-size:16px;font-weight:650}
.daily-copy span{color:var(--ink-2);font-size:13px}
.daily-dots{display:flex;justify-content:center;gap:7px;padding:12px 12px 0}
.daily-dot{width:7px;height:7px;padding:0;border:0;border-radius:99px;background:var(--ink-2);opacity:.35;cursor:pointer;transition:width .2s,opacity .2s}
.daily-dot.on{width:20px;opacity:1;background:var(--acc)}
.daily-empty{padding:18px;color:var(--ink-2);text-align:center}
.listcard{margin:16px 16px 0;background:var(--s1);border-radius:30px;padding:16px 10px 12px}
.listcard header{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 14px 12px}
.select{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-size:17px;font-weight:600;font-variation-settings:"wdth" 108,"ROND" 50}
.select .ic{width:22px;height:22px}

/* rows */
.row{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 8px;border-radius:20px;cursor:pointer;position:relative}
.row:active{background:var(--press)}
.row .art{width:52px;height:52px;border-radius:14px;flex:none;background:var(--s3)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:18px;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variation-settings:"wdth" 104,"ROND" 28}
.row .t span{display:block;color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .more{width:40px;height:44px;border-radius:16px;display:grid;place-items:center;color:var(--ink);flex:none}
.listcard .row .more{background:var(--s3)}
.row.is-cur{background:var(--acc-c);color:var(--on-acc-c)}
.row.is-cur .t span{color:var(--on-acc-c);opacity:.8}
.row.is-cur .more{background:color-mix(in srgb,var(--acc-c),var(--bg) 45%)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:620;white-space:nowrap;flex:none}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--on-acc)}
.row .num{width:26px;text-align:center;color:var(--ink-3);font-size:16px;flex:none;font-weight:500}
.rows-flat .row .art{width:52px;height:52px}

/* playlists tab */
.pl-card{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:26px;padding:14px;margin:0 16px 8px;cursor:pointer}
.pl-card .art{width:60px;height:60px;border-radius:16px;flex:none}
.pl-card .t{flex:1;min-width:0}
.pl-card .t b{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:560;font-variation-settings:"wdth" 106,"ROND" 30}
.pl-card .t b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-card .t b .ic{width:20px;height:20px;color:var(--ink-2);flex:none}
.pl-card .t em{font-style:normal;color:var(--ink-2);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:46px;height:46px;border-radius:50%;background:var(--acc-c);color:var(--on-acc-c);display:grid;place-items:center;flex:none}
.dots{width:30px;height:44px;display:grid;place-items:center;flex:none}
.pl-list{display:flex;flex-direction:column;padding-top:16px}

/* detail hero */
.dhero{position:relative;height:330px;overflow:hidden}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.15);filter:saturate(1.1)}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 30%,color-mix(in srgb,var(--bg) 55%,transparent) 70%,var(--bg) 100%)}
.dhero .top{position:absolute;top:20px;left:0;right:0;z-index:2;display:flex;justify-content:space-between}
.dhero .ttl{position:absolute;left:0;right:0;bottom:6px;z-index:2}
.dhero .ttl .title{font-size:37px;overflow-wrap:anywhere}
.dhero .ttl .sub{margin-top:8px;color:var(--ink-2)}
.actions{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.btn-play{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 30px 0 24px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:19px;font-weight:620;font-variation-settings:"wdth" 108,"ROND" 50}
.btn-play .ic{width:28px;height:28px}
.circ.xl{width:50px;height:50px;background:var(--acc-c)}
.circ.fab{width:66px;height:66px;background:var(--acc);color:var(--on-acc);margin-left:auto}
.circ.fab .ic{width:34px;height:34px}
.sortbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.sortbtn{display:inline-flex;align-items:center;gap:10px;background:var(--acc-c);color:var(--on-acc-c);border-radius:999px;padding:14px 24px;font-size:18px;font-weight:620;font-variation-settings:"wdth" 108,"ROND" 50}
.sortbtn .ic{width:22px;height:22px}
.count{display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:17px;font-weight:560}

/* artist */
.ahero{position:relative;margin:20px 16px 0;height:290px;border-radius:34px;overflow:hidden;box-shadow:0 18px 50px -20px var(--acc-c)}
.ahero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.5)}
.ahero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72));}
.ahero .meta{color:#fff;position:absolute;left:22px;right:22px;bottom:20px;z-index:2}
.ahero .nm{display:flex;align-items:center;gap:10px;font-size:37px;font-weight:780;line-height:1.05;font-variation-settings:"wdth" 124,"ROND" 45}
.ahero .nm .ic{width:30px;height:30px;color:var(--acc);flex:none}
.lstn{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:620}
.chips-o{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.chip-o{border:1.5px solid var(--line);border-radius:18px;padding:11px 20px;font-size:17px;font-weight:620;font-variation-settings:"wdth" 106,"ROND" 50}
.about h3{margin:18px 0 4px;color:var(--acc);font-size:18px;font-weight:620}
.about p{margin:0;font-size:18px;line-height:1.3;color:var(--ink);font-weight:440}
.about p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.about button{color:var(--acc);font-weight:620;font-size:18px;margin-top:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 8px}

/* search/create/discover */
.search-box{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:999px;padding:0 20px;height:58px;flex:1;min-width:0}
.search-box input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:17px;outline:0}
.search-box input::placeholder{color:var(--ink-3)}
.grp{margin:22px 0 6px;color:var(--ink-2);font-size:15px;font-weight:620;letter-spacing:.06em;text-transform:uppercase}
.artist-row{display:flex;align-items:center;gap:14px;padding:8px;border-radius:20px;cursor:pointer}
.artist-row .av{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none}
.artist-row .av img{width:100%;height:100%;object-fit:cover}
.artist-row b{font-size:18px;font-weight:560;display:block}
.artist-row span{color:var(--ink-2);font-size:14px}
.chips-w{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tg{border-radius:16px;padding:12px 18px;background:var(--s2);font-size:16px;font-weight:560;font-variation-settings:"wdth" 104,"ROND" 40;border:1.5px solid transparent;transition:background .2s,border-color .2s}
.tg.on{background:var(--acc-c);color:var(--on-acc-c);border-color:var(--acc)}
.card{background:var(--s1);border-radius:30px;padding:20px;margin:18px 16px 0}
.card h3{margin:0 0 4px;font-size:23px;font-weight:640;font-variation-settings:"wdth" 114,"ROND" 40}
.card .hint{color:var(--ink-2);font-size:15px;margin:0 0 6px}
.field{margin-top:20px}
.field label{display:flex;justify-content:space-between;font-size:16px;font-weight:600;margin-bottom:10px}
.field label span{color:var(--acc)}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--track) var(--p,50%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:36px;border-radius:3px;background:var(--acc);border:0}
input[type=range]::-moz-range-thumb{width:6px;height:36px;border-radius:3px;background:var(--acc);border:0}
.btn-wide{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:56px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:18px;font-weight:660;margin-top:26px;font-variation-settings:"wdth" 108,"ROND" 50}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mix{flex:none;width:168px;cursor:pointer}
.mix .cv{position:relative;width:168px;height:168px;border-radius:26px;overflow:hidden}
.mix .cv img{width:100%;height:100%;object-fit:cover}
.mix .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.6))}
.mix .cv b{position:absolute;left:14px;bottom:12px;z-index:2;font-size:20px;font-weight:720;font-variation-settings:"wdth" 118,"ROND" 50;line-height:1.05}
.mix p{margin:8px 4px 0;color:var(--ink-2);font-size:14px}
.alb{flex:none;width:132px;cursor:pointer}
.alb img{width:132px;height:132px;border-radius:22px}
.alb b{display:block;margin-top:8px;font-size:16px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb span{color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* preferences */
.group-h{margin:28px 0 12px;color:var(--ink-2);font-size:19px;font-weight:620;font-variation-settings:"wdth" 108,"ROND" 40}
.set{display:flex;align-items:center;gap:16px;width:100%;background:var(--s1);border-radius:26px;padding:16px;margin-bottom:6px}
.set .tile{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;flex:none}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-size:18px;font-weight:540;font-variation-settings:"wdth" 106,"ROND" 30}
.set .tx span{display:block;color:var(--ink-2);font-size:15px;line-height:1.25}
.sw{width:64px;height:38px;border-radius:999px;border:2px solid var(--sw-off);background:var(--s2);position:relative;flex:none;transition:background .2s,border-color .2s}
.sw::after{content:"";position:absolute;left:8px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--sw-off);translate:0 -50%;transition:all .22s var(--spring)}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on::after{left:30px;width:24px;height:24px;background:var(--on-acc)}

/* chrome */
.nav{position:absolute;left:50%;translate:-50% 0;bottom:20px;z-index:20;display:flex;align-items:center;gap:4px;background:var(--navbg);border-radius:999px;padding:8px;box-shadow:0 10px 40px var(--shadow);transition:translate .3s var(--ease),opacity .25s}
.nav.hide{translate:-50% 140%;opacity:0;pointer-events:none}
.nav-it{display:flex;align-items:center;justify-content:center;height:50px;min-width:50px;border-radius:999px;color:var(--ink);gap:0;transition:background .25s,padding .3s var(--ease)}
.nav-it span{max-width:0;overflow:hidden;white-space:nowrap;font-size:19px;font-weight:620;font-variation-settings:"wdth" 110,"ROND" 50;transition:max-width .3s var(--ease),margin .3s var(--ease)}
.nav-it.on{background:var(--acc-c);color:var(--on-acc-c);padding:0 20px}
.nav-it.on span{max-width:130px;margin-left:10px}
.mini{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:98px;z-index:19;display:flex;align-items:center;gap:12px;background:var(--navbg);border-radius:28px;padding:10px 12px 12px 10px;box-shadow:0 14px 44px var(--shadow);overflow:hidden;transition:bottom .3s var(--ease),opacity .25s,translate .3s var(--ease);cursor:pointer}
.mini.low{bottom:20px}
.mini.hide{opacity:0;translate:0 30px;pointer-events:none}
.mini img{width:56px;height:56px;border-radius:16px;flex:none}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-size:19px;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{display:block;color:var(--ink-2);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:66px;height:50px;border-radius:999px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}
.mini .nx{width:50px;height:50px;border-radius:20px 999px 999px 20px;background:var(--s3);display:grid;place-items:center;flex:none;margin-left:-8px}
.mini .bar{position:absolute;left:12px;bottom:6px;height:3px;border-radius:2px;background:var(--acc);width:0}
.glass .nav,.glass .mini{background:var(--glassbg);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--glassline)}
.glass .nav-it.on{background:var(--g3)}

/* player */
.player{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);transform:translateY(102%);transition:transform .4s var(--ease);visibility:hidden}
.player.open{transform:none;visibility:visible}
.player .wash{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,var(--tint,var(--s1)) 0%,var(--wash2) 62%,var(--bg) 100%);z-index:0}
.player>*:not(.wash){position:relative;z-index:1}
.p-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:8px}
.p-top .sq{width:48px;height:48px;border-radius:18px;background:var(--g1);display:grid;place-items:center}
.p-top .mid{text-align:center;min-width:0}
.p-top .mid small{display:block;font-size:16px;font-weight:640;letter-spacing:.06em;text-transform:uppercase;font-variation-settings:"wdth" 108,"ROND" 30}
.p-top .mid span{display:block;font-size:18px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.p-stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center;padding-block:6px}
.p-art{width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:30px;overflow:hidden;box-shadow:0 30px 80px -30px var(--shadow);transition:transform .5s var(--spring)}
.p-art img{width:100%;height:100%;object-fit:cover}
.paused .p-art{transform:scale(.93)}
.p-info{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-top:14px}
.p-info .tt{min-width:0}
.p-info h2{margin:0;font-size:30px;font-weight:760;line-height:1.08;font-variation-settings:"wdth" 120,"ROND" 50;overflow-wrap:anywhere}
.p-chip{display:inline-block;margin-top:10px;background:var(--acc-c);color:var(--on-acc-c);border-radius:16px;padding:10px 18px;font-size:19px;font-weight:540}
.p-info .lyr{width:52px;height:52px;border-radius:20px;background:var(--g1);display:grid;place-items:center;flex:none;transition:background .2s}
.p-info .lyr.on{background:var(--acc);color:var(--on-acc)}
.seek{padding-top:18px}
.seek svg{display:block;width:100%;height:44px;touch-action:none;cursor:pointer}
.times{display:flex;justify-content:space-between;color:var(--ink-2);font-size:18px;font-weight:540;margin-top:6px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 0 10px}
.cb{width:62px;height:62px;border-radius:24px;background:var(--g2);display:grid;place-items:center;transition:border-radius .3s var(--spring),transform .15s}
.cb:active{transform:scale(.94)}
.cb .ic{width:30px;height:30px}
.cb.main{width:84px;height:74px;border-radius:28px;background:var(--acc);color:var(--on-acc)}
.cb.main .ic{width:38px;height:38px}
.playing .cb.main{border-radius:37px}
.p-bot{display:flex;gap:10px;padding-bottom:16px}
.p-bot button{flex:1;height:56px;border-radius:24px;background:var(--g1);display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:620;transition:background .2s,color .2s}
.p-bot button.on{background:var(--acc-c);color:var(--on-acc-c)}
.p-bot .q{flex:1.7;white-space:nowrap;padding:0 6px}.p-bot button:not(.q){flex:.8}
.hq{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:5px;background:var(--acc);color:var(--on-acc);font-size:12px;font-weight:800;letter-spacing:.02em}
.lyrics{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-block:30px 40vh;mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 80%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 80%,transparent 100%)}
.lyrics::-webkit-scrollbar{display:none}
.ly{margin:0 0 22px;font-size:28px;line-height:1.15;font-weight:760;font-variation-settings:"wdth" 118,"ROND" 50;opacity:.32;transform-origin:left center;transform:scale(.86);transition:opacity .5s,transform .6s var(--spring),filter .5s;cursor:pointer;filter:blur(1.4px)}
.ly.near{filter:blur(.6px);opacity:.5}
.ly.on{opacity:1;transform:scale(1);filter:none;color:var(--ink-hi)}
.ly.plain{opacity:.9;transform:none;font-size:calc(22px * var(--lys,1));font-weight:620}
.p-info{gap:10px}
.simple .ly{transform:none;filter:none}
.simple .ly.on{color:var(--acc)}
.ly-empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--ink-2);font-size:21px;padding:0 24px;font-variation-settings:"wdth" 112,"ROND" 50}

/* sheet / toast */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--sheetbg);border-radius:34px 34px 0 0;padding-top:12px;padding-bottom:20px;max-height:88%;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s;scrollbar-width:none;box-shadow:0 -1px 0 var(--hair)}
.sheet.on{transform:none;visibility:visible;transition:transform .38s var(--ease),visibility 0s 0s}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--s4);margin:0 auto 16px}
.sh-h{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.sh-h .tile{width:50px;height:50px;border-radius:18px;background:var(--acc-c);color:var(--on-acc-c);display:grid;place-items:center;flex:none}
.sh-h h3{margin:0;font-size:28px;font-weight:700;line-height:1.05;font-variation-settings:"wdth" 118,"ROND" 50}
.sh-h p{margin:2px 0 0;color:var(--ink-2);font-size:16px}
.note{color:var(--ink-2);font-size:16px;line-height:1.3;margin:6px 0 16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--s2);border:2px solid transparent;border-radius:24px;padding:14px 18px;margin-bottom:10px;transition:background .2s,border-color .2s}
.opt.on{background:var(--acc-c);color:var(--on-acc-c);border-color:var(--acc)}
.opt .tx{flex:1;min-width:0}
.opt b{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:20px;font-weight:540}
.opt b i{font-style:normal;background:var(--s3);border-radius:10px;padding:4px 11px;font-size:13px;font-weight:700;letter-spacing:.02em}
.opt.on b i{background:var(--acc);color:var(--on-acc)}
.opt .tx>span{display:block;color:var(--ink-2);font-size:16px;margin-top:4px}
.opt.on .tx>span{color:var(--on-acc-c)}
.opt .ck{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none;scale:0;transition:scale .25s var(--spring)}
.opt.on .ck{scale:1}
.menu-row{display:flex;align-items:center;gap:18px;width:100%;padding:16px 8px;border-radius:20px;font-size:18px;font-weight:540}
.menu-row:active{background:var(--press)}
.menu-row .ic{color:var(--ink-2)}
.menu-head{display:flex;align-items:center;gap:14px;padding:0 8px 12px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.menu-head img{width:60px;height:60px;border-radius:16px}
.menu-head b{display:block;font-size:18px;font-weight:600}
.menu-head span{color:var(--ink-2);font-size:15px}
.eq{display:flex;gap:6px;justify-content:space-between;margin:10px 0 20px}
.eqb{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.eqb input{writing-mode:vertical-lr;direction:rtl;width:14px;height:160px;background:none;accent-color:var(--acc)}
.eqb small{color:var(--ink-2);font-size:12px}
.eqb output{font-size:13px;font-weight:620;font-variant-numeric:tabular-nums}

async function googleSignIn(screen,button){
  const error=$('#account-error',screen);
  const clientId=window.EVA_GOOGLE_CLIENT_ID;
  if(!clientId){ accountError(screen,'Google sign-in needs a Client ID.'); return; }
  const host=$('#account-google-host',screen);
  button.disabled=true;
  try{
    if(!window.google?.accounts?.id){
      if(!googleScriptPromise){
        googleScriptPromise=new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src='https://accounts.google.com/gsi/client';
          script.async=true; script.defer=true;
          script.onload=resolve;
          script.onerror=()=>reject(new Error('Could not load Google sign-in. Check your connection and try again.'));
          document.head.appendChild(script);
        });
      }
      await googleScriptPromise;
    }
    if(!window.google?.accounts?.id) throw new Error('Google sign-in is unavailable in this browser.');
    const onCredential=credentialResponse=>{
      try{
        const token=credentialResponse.credential;
        if(!token) throw new Error('Google did not return an account. Please try again.');
        const payload=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
        const claims=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(payload),char=>char.charCodeAt(0))));

          throw new Error('Google did not return a verified email address.');
        }

        const user={id:'google-'+claims.sub,name:typeof claims.name==='string'?claims.name:'Eva listener',email,google:true,avatar:typeof claims.picture==='string'?claims.picture:''};
        users[email]=user;
        localStorage.setItem('eva.users',JSON.stringify(users));
        localStorage.setItem('eva.session',JSON.stringify({id:user.id,name:user.name,email:user.email,google:true}));
        error.textContent='';
        finishAccountSignIn(screen,{id:user.id,name:user.name,email:user.email,google:true},'Signed in with Google');
      }catch(err){
        console.error('[Eva Music] Google sign-in failed.',err);
        accountError(screen,err instanceof Error?err.message:'Could not sign in with Google.');
      }finally{
        if(button.isConnected) button.disabled=false;
      }
    };
    window.google.accounts.id.initialize({client_id:clientId,callback:onCredential});
    host.hidden=false;
    host.replaceChildren();
    window.google.accounts.id.renderButton(host,{theme:'filled_black',size:'large',shape:'pill',text:'continue_with',width:320});

  }catch(err){
    console.error('[Eva Music] Google sign-in setup failed.',err);
    googleScriptPromise=undefined;
    accountError(screen,err instanceof Error?err.message:'Could not start Google sign-in.');
    button.disabled=false;
  }
}

      if (!response.ok) throw new Error(`Search API returned ${response.status}`);
      const data = await response.json();
      if (Array.isArray(data.results)) backendResults = data.results;
    } catch (error) {
      console.warn('[Eva Music] Backend search unavailable; using catalog providers.', error);
    }
    if (backendResults.length) return {results:backendResults};
    let providerResults = [];
    try { providerResults = await jSearch(query, type, lang); }
    catch (error) {
      if (!backendResults.length) throw error;
      console.warn('[Eva Music] Catalog provider search unavailable.', error);
    }
    providerResults = providerResults.filter(track => !track.preview && track.durationSeconds > 45 && track.audioUrl);
    const seen = new Set(backendResults.map(t=>norm(t.title)+'|'+norm(t.artist).split(' ')[0]));
    return {results:[...backendResults,...providerResults.filter(t=>!seen.has(norm(t.title)+'|'+norm(t.artist).split(' ')[0]))]};
  }
  if (parts[1]==='recommendations') return {recommendations: await jRecs(q.get('genre')||'', Math.min(+q.get('limit')||20, 40), q.get('lang')||'')};
  if (parts[1]==='lyrics') return jLyrics(parts[2], q.get('title'), q.get('artist'));
  if (parts[1]==='library'){
    const kind = parts[2];
    if (kind==='playlists'){
      if (parts.length===3){
        if (method==='GET') return {playlists: LIB.playlists};
        const row = {id:rid(), name:body.name||'My Playlist', description:'', created_at:nowIso(), playlist_tracks:[]}; LIB.playlists.unshift(row); saveLib(); return {playlist:row};
      }
      const pl = LIB.playlists.find(p=>p.id===parts[3]);
      if (parts.length===4 && method==='DELETE'){ LIB.playlists = LIB.playlists.filter(p=>p.id!==parts[3]); saveLib(); return {success:true}; }
      if (!pl) throw new Error('Playlist not found');
      if (parts[4]==='tracks' && method==='POST'){ let r = pl.playlist_tracks.find(x=>x.track_id===body.trackId); if (!r){ r = {id:rid(), playlist_id:pl.id, ...rowMeta(body), position:pl.playlist_tracks.length, added_at:nowIso()}; pl.playlist_tracks.push(r); saveLib(); } return {track:r}; }
      if (parts[4]==='tracks' && method==='DELETE'){ pl.playlist_tracks = pl.playlist_tracks.filter(x=>x.track_id!==parts[5]); saveLib(); return {success:true}; }
    }
    if (kind==='favorites'){
      if (method==='GET') return {favorites: LIB.favorites};
      if (method==='POST'){ LIB.favorites = LIB.favorites.filter(f=>f.track_id!==body.trackId); LIB.favorites.unshift({...rowMeta(body), added_at:nowIso()}); saveLib(); return {success:true}; }
      if (method==='DELETE'){ LIB.favorites = LIB.favorites.filter(f=>f.track_id!==parts[3]); saveLib(); return {success:true}; }
    }
    if (kind==='history'){
      if (method==='GET') return {history: LIB.history.slice(0,50)};
      if (method==='POST'){ LIB.history.unshift({id:rid(), ...rowMeta(body), played_at:nowIso(), ms_played:body.msPlayed||0}); LIB.history = LIB.history.slice(0,200); saveLib(); return {record:true}; }
    }
  }
  throw new Error('Unsupported request');
}
const apiErr = e => toast(e.message || 'Something went wrong');

function playbackUrl(url){
  if (!url) return '';
  try {
    const parsed = new URL(url, location.href);
    if (parsed.protocol === 'https:' && (parsed.hostname === 'saavncdn.com' || parsed.hostname.endsWith('.saavncdn.com'))) {
      return appApiUrl('/api/stream?url='+encodeURIComponent(parsed.href));
    }
  } catch(e) {
    console.warn('[Eva Music] Invalid track audio URL.', e);
  }
  return url;
}
async function refreshSaavnAudio(t){
  const query = [t.title, ART[t.ar]?.name].filter(Boolean).join(' ');
  const response = await fetch(appApiUrl('/api/search?'+new URLSearchParams({q:query})), {signal:AbortSignal.timeout(6000)});
  if (!response.ok) throw new Error(`Track refresh returned ${response.status}`);
  const data = await response.json();
  const match = Array.isArray(data.results) && data.results.find(track=>track.id===t.id && typeof track.audioUrl==='string');
  if (!match) throw new Error(`Fresh audio URL not found for ${t.title}`);
  return match.audioUrl;
}
function ingest(x){ // x: backend TrackItem
  const arId = x.artistId || ('a'+hash(x.artist||'?').toString(36));
  const alId = x.albumId || ('b'+hash((x.album||x.title)+(x.artist||'')).toString(36));
  if (!ART[arId]){ const a = {id:arId, name:x.artist||'Unknown artist', genres:x.genre?[x.genre]:[], bio:'', listeners:'', verified:false}; ART[arId]=a; ARTISTS.push(a); }
  else if (x.genre && !ART[arId].genres.includes(x.genre) && ART[arId].genres.length<4) ART[arId].genres.push(x.genre);
  if (!ALB[alId]){ const al = {id:alId, title:x.album||x.title, ar:arId, yr:+x.releaseYear||0, cover:x.coverUrl||'', pal:palFor(alId), pat:PATS[hash(alId)%PATS.length]}; ALB[alId]=al; ALBUMS.push(al); }
  else if (x.coverUrl && !ALB[alId].cover) ALB[alId].cover = x.coverUrl;
  let t = TR[x.id];
  if (!t){ t = TR[x.id] = {id:x.id, title:x.title, ar:arId, al:alId, dur:x.durationSeconds||0, moods:[], en:50, preview:!!x.preview}; TRACKS.push(t); }
  else if (x.durationSeconds && t.preview===!!x.preview) t.dur = x.durationSeconds;
  if (x.audioUrl && t.preview===!!x.preview) {
    t.src = playbackUrl(x.audioUrl);
    t.fallbackSrc = x.audioUrl;
  }
  return t.id;
}
const ingestAll = list => (list||[]).map(ingest);
function ingestRow(r){ // library row (snake_case)
  return ingest({preview:isItn(r.track_id), id:r.track_id, title:r.title, artist:r.artist, artistId:r.artist_id, album:r.album, albumId:r.album_id, coverUrl:r.thumbnail_url, durationSeconds:r.duration_seconds});
}

const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); } catch(e){ return ''; } };
function rowToPlaylist(p){ const rows=(p.playlist_tracks||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0)); return {id:p.id, name:p.name, pin:false, date:fmtDate(p.created_at), tracks:rows.map(ingestRow)}; }

let searchSeq = 0, searchT = 0;
const SEARCH_STOP_WORDS = new Set(['a','an','and','by','for','from','in','of','on','song','the','to','track']);
function runSearch(q){
  clearTimeout(searchT); q = q.trim();
  if (!q){ S.results = []; S.searching = false; return; }
  S.searching = true;
  searchT = setTimeout(async ()=>{
    const my = ++searchSeq;
    try {
      const get = async term => ingestAll((await api('/api/search?q='+encodeURIComponent(term)+langQ())).results);
      let ids = await get(q);
      if (my!==searchSeq) return;
      const words = norm(q).split(' ').filter(w=>w.length>2);
      const meaningfulWords = words.filter(w=>!SEARCH_STOP_WORDS.has(w));
      const hasTitleMatch = ids.some(id=>{
        const title = norm(TR[id]?.title).split(' ');
        return meaningfulWords.some(word=>title.some(part=>part===word || part.startsWith(word)));
      });
      if ((ids.length < 6 || !hasTitleMatch) && meaningfulWords.length > 1){
        const extra = await Promise.all(meaningfulWords.sort((a,b)=>b.length-a.length).slice(0,2).map(w=>get(w).catch(()=>[])));
        ids = [...new Set([...ids, ...extra.flat()])];
      }
      if (ids.length < 3){                                  // spelling rescue: collapse doubled letters (karrupu -> karupu), then drop the last letter
        const nq = norm(q), v1 = nq.replace(/(\p{L})\1+/gu,'$1');
        for (const v of [v1, nq.length>4 ? nq.slice(0,-1) : '']){ if (!v || v===nq) continue; const more = await get(v).catch(()=>[]); ids = [...new Set([...ids, ...more])]; if (ids.length>=3) break; }
      }
      if (my!==searchSeq) return;
      S.results = rankIds(ids, q);
      if (S.results.length) addRecent(q);
    } catch(e){ if (my!==searchSeq) return; S.results = []; apiErr(e); }
    S.searching = false; const box=$('#results'); if (box) box.innerHTML = searchResults();
  }, 300);
}

const audio = new Audio(); audio.preload = 'auto';
let scrobbled = '';
function loadCurrent(autoplay){
  const id = S.cur; if (!id) return;
  scrobbled = '';
  const t = TR[id];
  t.fallbackTried = false;
  const startPlayback = () => {
    if (!autoplay) return;
    const p = audio.play();
    if (p && p.catch) p.catch(e=>{ if (S.cur===id && e.name!=='AbortError'){ S.playing=false; syncPlayState(); toast('Tap play to start'); } });
  };
  if (t.preview){
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    S.playing = false;
    syncPlayState();
    if (!t.fullTried){
      t.fullTried = true;
      findFull(t).then(f=>{
        if (!f || f.preview || !(f.durationSeconds > 45) || !f.audioUrl){
          if (S.cur===id) toast('Full track unavailable; preview skipped');
          return;
        }
        t.src = f.audioUrl;
        t.fallbackSrc = f.audioUrl;
        t.preview = false;
        t.dur = f.durationSeconds;
        if (S.cur===id){
          audio.src = f.audioUrl;
          startPlayback();
          renderMini();
          buildPlayer();
          syncRows();
        }
      }).catch(error=>{
        console.warn('[Eva Music] Full-track lookup failed.', error);
        if (S.cur===id) toast('Full track unavailable; preview skipped');
      });
    } else if (S.cur===id){
      toast('Full track unavailable; preview skipped');
    }
    fetchLyrics(id);
    setMediaSession();
    return;
  }
  if (String(id).startsWith('saavn-')){
    t.src = appApiUrl('/api/stream?trackId='+encodeURIComponent(id)+'&v='+Date.now());
    audio.src = t.src;
    startPlayback();
  } else if (t.src){ audio.src = t.src; startPlayback(); }
  else {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    jRaw(id).then(r=>{
      if (!r || !r.audio){ toast('Track not available'); return; }
      t.src = r.audio;
      if (S.cur===id){ audio.src = t.src; startPlayback(); }
    }).catch(apiErr);
  }
  fetchLyrics(id); setMediaSession();
}
audio.addEventListener('play', ()=>{ S.playing = true; syncPlayState(); });
audio.addEventListener('pause', ()=>{ if (audio.ended) return; S.playing = false; syncPlayState(); });
audio.addEventListener('loadedmetadata', ()=>{ const t=TR[S.cur]; if (t && isFinite(audio.duration) && audio.duration>0 && Math.abs(audio.duration-t.dur)>1.5){ t.dur = audio.duration; if (S.player){ const sv=$('#seekSvg'); sv && sv.setAttribute('aria-valuemax', Math.floor(t.dur)); } } updateMediaSessionPosition(); });
audio.addEventListener('timeupdate', ()=>{
  if (typeof dragging!=='undefined' && dragging) return;
  S.pos = audio.currentTime; updateTick(); updateMediaSessionPosition();
  if (!scrobbled && S.cur && audio.currentTime > 8){ scrobbled = S.cur; recordPlay(S.cur); }
});
audio.addEventListener('ended', ()=>nextTrack(true));
audio.addEventListener('error', ()=>{
  const t = TR[S.cur];
  if (!t || !audio.src) return;
  if (String(t.id).startsWith('saavn-') && !t.fallbackTried){
    t.fallbackTried = true;
    const failedSrc = audio.src;
    refreshSaavnAudio(t).then(url=>{
      if (S.cur!==t.id || audio.src!==failedSrc) return;
      t.fallbackSrc = url;
      t.src = playbackUrl(url);
      audio.src = t.src;
      const p = audio.play();
      if (p && p.catch) p.catch(error=>{
        if (S.cur===t.id && error.name!=='AbortError'){
          S.playing = false;
          syncPlayState();
          toast('Tap play to start');
        }
      });
    }).catch(error=>{
      console.error('[Eva Music] Saavn stream refresh failed.', error);
      if (S.cur===t.id){
        S.playing = false;
        syncPlayState();
        toast('Could not refresh this track');
      }
    });
    return;
  }
  if (!String(t.id).startsWith('saavn-') && t.fallbackSrc && t.src !== t.fallbackSrc && !t.fallbackTried){
    t.fallbackTried = true;
    audio.src = t.fallbackSrc;
    audio.play().catch(()=>{});
    return;
  }
  S.playing = false;
  syncPlayState();
  toast('Could not play this track');
});
async function recordPlay(id){
  if (!S.scrobble) return;

function seekTo(t){ S.pos = clamp(t, 0, dur(S.cur)); if (isFinite(S.pos)) audio.currentTime = S.pos; updateTick(); updateMediaSessionPosition(); }
function updateMediaSessionPosition(){
  if (!('mediaSession' in navigator) || typeof navigator.mediaSession.setPositionState!=='function' || !S.cur) return;
  const duration = isFinite(audio.duration) && audio.duration>0 ? audio.duration : dur(S.cur);
  if (!isFinite(duration) || duration<=0) return;
  try {
    navigator.mediaSession.setPositionState({duration, playbackRate:audio.playbackRate||1, position:clamp(audio.currentTime||0, 0, duration)});
  } catch(error) {
    console.warn('[Eva Music] Media session position update failed.', error);
  }
}
function setMediaSession(){
  if (!('mediaSession' in navigator) || !S.cur || typeof MediaMetadata==='undefined') return;
  const t = TR[S.cur], al = ALB[t.al];
  try {
    const session = navigator.mediaSession;
    session.metadata = new MediaMetadata({title:t.title, artist:ART[t.ar].name, album:al.title, artwork:[{src:art(al)}]});
    const handlers = {
      play:()=>audio.play().catch(error=>console.warn('[Eva Music] Media session playback failed.', error)),
      pause:()=>audio.pause(),
      nexttrack:()=>nextTrack(false),
      previoustrack:()=>prevTrack(),
      seekto:event=>{ if (isFinite(event.seekTime)) seekTo(event.seekTime); }
    };
    for (const [action, handler] of Object.entries(handlers)){
      try { session.setActionHandler(action, handler); }
      catch(error){ console.warn(`[Eva Music] Media session action "${action}" is unavailable.`, error); }
    }
    session.playbackState = S.playing ? 'playing' : 'paused';
    updateMediaSessionPosition();
  } catch(error) {
    console.warn('[Eva Music] Media session metadata setup failed.', error);
  }
}

/* ---- search engine: ranking, typo tolerance, library-first results, recents ---- */
const norm = x => String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function lev1(a,b){ if (a===b) return true; if (Math.abs(a.length-b.length)>1) return false; let i=0,j=0,e=0;
  while (i<a.length && j<b.length){ if (a[i]===b[j]){ i++; j++; continue; } if (++e>1) return false; if (a.length>b.length) i++; else if (a.length<b.length) j++; else { i++; j++; } }
  return e + (a.length-i) + (b.length-j) <= 1; }
function score(t, q){
  const nq = norm(q); if (!nq) return 0;
  const title = norm(t.title), art = norm(ART[t.ar].name), words = (title+' '+art).split(' '); let sc = 0;
  if (title===nq) sc += 100; else if (title.startsWith(nq)) sc += 80; else if (title.includes(nq)) sc += 60;
  if (art===nq) sc += 70; else if (art.includes(nq)) sc += 45;
  const toks = nq.split(' ').filter(token=>!SEARCH_STOP_WORDS.has(token)); let hit = 0;
  if (!toks.length) return sc;
  for (const tk of toks){ if (words.some(w=>w===tk || w.startsWith(tk))) hit++; else if (tk.length>3 && words.some(w=>lev1(w,tk))) hit += .6; }
  return sc + 30*hit/toks.length;
}
const rankIds = (ids, q) => ids.map((id,i)=>({id, i, sc:score(TR[id], q)})).sort((x,y)=>(y.sc-x.sc)||(x.i-y.i)).map(x=>x.id);
function localMatches(q){
  const pool = new Set([...LIKED.tracks, ...HISTORY, ...PLAYLISTS.flatMap(p=>p.tracks)]);
  return [...pool].filter(id=>TR[id] && score(TR[id], q) >= 45).sort((a,b)=>score(TR[b],q)-score(TR[a],q)).slice(0,5);
}
const getRecent = () => { try { return JSON.parse(LS.get('eva.recent','[]')); } catch(e){ return []; } };
function addRecent(q){ q = q.trim(); if (q.length<2) return; const l = [q, ...getRecent().filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,8); LS.set('eva.recent', JSON.stringify(l)); }
const SFILTERS = [['all','All'],['songs','Songs'],['artists','Artists']];

  if (!ts.length) return filters + libHtml + `<div class="empty">No results for “${E(S.q)}”.<br><small>Check the spelling, try fewer words, or switch the language.</small></div>`;
  const seen = new Set(), as = ts.map(t=>ART[t.ar]).filter(a=>!seen.has(a.id)&&seen.add(a.id)).slice(0,f==='artists'?12:4);

  return filters + libHtml + artHtml + songHtml;
}

/* ---------- screen management ---------- */
const screensEl = $('#screens');
const isTab = n => TABS.includes(n);
function initAccountCanvas(screen){
  const account=$('.account',screen), canvas=$('.account-canvas',screen);
  if (!account || !canvas) return;
  const context=canvas.getContext('2d');
  if (!context) return;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state={energy:0,error:0,cx:.5,targetX:.5,flat:reduced?0:1,started:performance.now(),last:performance.now(),frame:0,width:0,height:0,dpr:1,accent:[198,220,233],scene:{top:0,height:0},running:true};
  const inputs=$$('input',account);
  const resizeObserver=new ResizeObserver(()=>{resize();if(reduced)draw(0);});
  const readAccent=()=>{
    const swatch=document.createElement('span');
    swatch.style.color=getComputedStyle(account).getPropertyValue('--account-accent')||'#c6dce9';
    account.appendChild(swatch);
    const values=getComputedStyle(swatch).color.match(/\d+/g);
    swatch.remove();
    if(values) state.accent=values.slice(0,3).map(Number);
  };
  const resize=()=>{
    const rect=account.getBoundingClientRect(), scene=$('.account-scene, .account-hero',account).getBoundingClientRect();
    state.dpr=Math.min(2,window.devicePixelRatio||1);
    state.width=rect.width; state.height=rect.height;
    state.scene={top:scene.top-rect.top,height:scene.height};
    canvas.width=Math.round(rect.width*state.dpr); canvas.height=Math.round(rect.height*state.dpr);
    canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
  };
  const wave=(x,time,row)=>Math.sin(x*3.2+time*.8+row*.55)*.5+Math.sin(x*7.4-time*1.15+row*1.7)*.3+Math.sin(x*13.3+time*1.9-row*.45)*.2;
  const draw=time=>{
    context.setTransform(state.dpr,0,0,state.dpr,0,0);
    context.fillStyle='#07080a'; context.fillRect(0,0,state.width,state.height);
    const top=state.scene.top+state.scene.height*.12, span=state.scene.height*.88, middle=top+span*.62, settle=state.flat;
    const energetic=.18+state.energy*.9+(inputs.includes(document.activeElement) ? .22 : 0);
    const beat=reduced?0:.5+.5*Math.sin(time*2.2);
    for(let row=0;row<24;row++){
      const factor=row/23, baseY=middle+(top+span*factor-middle)*(1-settle*.985);
      const amplitude=span*.5*(.35+.65*factor)*energetic*(1-settle);
      context.beginPath();
      for(let point=0;point<=72;point++){
        const x=point/72, delta=x-state.cx, envelope=Math.exp(-(delta*delta)/.05)+.1*Math.exp(-((x-.12)*(x-.12))/.01);
        const y=baseY-amplitude*envelope*(.5+.5*wave(x,time,row))*(1+.08*beat*(1-factor));
        if(point) context.lineTo(x*state.width,y); else context.moveTo(0,y);
      }
      const k=state.error, [r,g,b]=state.accent;
      context.lineWidth=1.15+factor*.5;
      context.strokeStyle=`rgba(${Math.round(r+(255-r)*k*.9)},${Math.round(g+(138-g)*k)},${Math.round(b+(120-b)*k)},${.1+Math.pow(factor,1.7)*.85})`;
      context.stroke();
    }
  };
  const tick=now=>{
    if(!state.running) return;
    const dt=Math.min(.05,(now-state.last)/1000); state.last=now;
    state.energy*=Math.pow(.12,dt); state.error*=Math.pow(.3,dt);
    state.cx+=(state.targetX-state.cx)*Math.min(1,dt*3);
    if(!reduced&&state.flat>0) state.flat=Math.max(0,state.flat-dt*.75);
    draw((now-state.started)/1000);
    state.frame=requestAnimationFrame(tick);
  };
  const kick=()=>{state.energy=Math.min(1,state.energy+.3);};
  const onPointer=e=>{
    const rect=account.getBoundingClientRect();
    state.targetX=.2+.6*((e.clientX-rect.left)/Math.max(1,rect.width));
  };
  const onInput=()=>{
    const input=document.activeElement;
    if(input && input.matches('input')) input.closest('.account-field')?.classList.toggle('has',!!input.value);
    kick();
    const error=$('#account-error',account);
    if(error) error.textContent='';
  };
  const onFocus=()=>{state.targetX=.5;kick();};
  const onVisibility=()=>{if(document.hidden){cancelAnimationFrame(state.frame);}else{state.last=performance.now();state.frame=requestAnimationFrame(tick);}};
  const onResize=()=>{resize();if(reduced)draw(0);};
  account.addEventListener('pointermove',onPointer);
  account.addEventListener('input',onInput);
  inputs.forEach(input=>input.addEventListener('focus',onFocus));
  window.addEventListener('resize',onResize);
  document.addEventListener('visibilitychange',onVisibility);
  readAccent(); resize(); resizeObserver.observe(account); draw(0);
  if(!reduced) state.frame=requestAnimationFrame(tick);
  screen.stopAccountCanvas=()=>{
    state.running=false; cancelAnimationFrame(state.frame);
    account.removeEventListener('pointermove',onPointer);
    account.removeEventListener('input',onInput);
    inputs.forEach(input=>input.removeEventListener('focus',onFocus));
    resizeObserver.disconnect();
    window.removeEventListener('resize',onResize);
    document.removeEventListener('visibilitychange',onVisibility);
  };
  screen.shakeAccount=()=>{
    state.error=1; kick();
    account.classList.remove('shake'); void account.offsetWidth; account.classList.add('shake');
    setTimeout(()=>account.classList.remove('shake'),500);
  };
  screen.settleAccount=()=>{state.flat=1;state.energy=0;};
}
function mount(name){

function renderScreens(){
  const want = [S.tab, ...S.stack];
  $$('.screen', screensEl).forEach(el=>{
    const n = el.dataset.v;

    if (!want.includes(n)){ el.stopAccountCanvas?.(); el.dataset.v = 'leaving'; el.classList.add('out'); setTimeout(()=>el.remove(), 360); }
  });
  want.forEach((n,i)=>{
    let el = $(`.screen[data-v="${n}"]`, screensEl) || mount(n);

  });
  $$('.screen', screensEl).forEach(el=>{ if(isTab(el.dataset.v)) el.hidden = el.dataset.v !== S.tab; });
  const top = want[want.length-1];
  document.documentElement.style.setProperty('--band', S.player ? 'var(--bg)' : (BAND[top] ? 'var(--hdr-a)' : 'var(--bg)'));
}

    case 'sfilter': S.sfilter = v; { const r=$('#results'); if (r) r.innerHTML = searchResults(); } break;
    case 'clear-recent': LS.set('eva.recent','[]'); { const r=$('#results'); if (r) r.innerHTML = searchResults(); } break;
    case 'lang': S.lang = v; try { localStorage.setItem('eva.lang', v); } catch(e){} loadTrending().then(()=>refreshAll()); { const q=$('#q'); if (q && S.q.trim()) runSearch(S.q); const r=$('#results'); if (r) r.innerHTML = searchResults(); } toast(v ? 'Showing '+LANGS.find(x=>x[0]===v)[1]+' songs' : 'Showing all languages'); break;
    case 'addpl': openSheet('addpl',{id:v}); break;
    case 'pick-pl': closeSheet(); addToPlaylist(el.dataset.pl, v); break;
    case 'rm-from-pl': closeSheet(); removeFromPlaylist(el.dataset.pl, v); break;
    case 'del-pl': deletePlaylist(v); break;
    case 'new-pl': newPlaylist(); break;
    case 'new-pl-add': closeSheet(); newPlaylist(v); break;
    case 'artist-radio': artistRadio(v); break;
    case 'close-player': S.player = false; S.lyrics = false; render(); break;
    case 'open-player': S.player = true; render(); break;
    case 'open-artist': S.sheet = null; S.player = false; S.stack = S.stack.filter(x=>!x.startsWith('artist-')); S.stack.push('artist-'+v); S.bioOpen=false; render(); loadArtist(v); break;
    case 'play-pl': { const p = getPlaylist(v); let l = p.tracks.slice(); if (el.dataset.shuf){ l = shuffleArr(l); } playTrack(l[0], l, p.name); if (el.dataset.shuf){ S.shuffle = true; buildPlayer(); } toast('Playing '+p.name); break; }
    case 'play-artist': { let l = artistTracks(v).map(t=>t.id); if (el.dataset.shuf) l = shuffleArr(l); playTrack(l[0], l, ART[v].name); break; }
    case 'sort-detail': { const id = v, k = 'dsort_'+id, order = ['custom','title','artist']; S[k] = order[(order.indexOf(S[k]||'custom')+1)%3]; refresh('playlist-'+id); break; }
    case 'bio': S.bioOpen = !S.bioOpen; refresh(S.stack[S.stack.length-1]); break;
    case 'mood': { const i = S.mood.indexOf(v); if (i>=0) S.mood.splice(i,1); else S.mood.push(v); if(!S.mood.length) S.mood=[v]; $$('#moods .tg').forEach(b=>{ const on=S.mood.includes(b.dataset.v); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }); break; }
    case 'generate': generatePlaylist(el); break;
    case 'query': S.q = v; $('#q').value = v; runSearch(v); $('#results').innerHTML = searchResults(); break;
    case 'query-go': go('search'); S.q = v; { const q=$('#q'); if (q) q.value = v; } runSearch(v); { const r=$('#results'); if (r) r.innerHTML = searchResults(); } break;
    case 'play-next': { const id=v; S.queue = S.queue.filter(x=>x!==id); const at = S.queue.indexOf(S.cur); S.queue.splice(at+1,0,id); S.qi = S.queue.indexOf(S.cur); closeSheet(); toast('Will play next'); break; }
    case 'add-queue': { const id=v; if(!S.queue.includes(id)) S.queue.push(id); closeSheet(); toast('Added to queue'); break; }
    case 'jump': { const i=+v; playTrack(S.queue[i]); closeSheet(); break; }
  }
}
const app = $('#app');
app.addEventListener('submit',async e=>{
  const form=e.target;
  if (!form || form.id!=='account-form') return;
  e.preventDefault();
  const screen=form.closest('#account-screen'), error=$('#account-error',form), submit=$('.account-submit',form);
  const mode=screen.dataset.mode, name=$('#account-name',form).value.trim(), email=$('#account-email',form).value.trim().toLowerCase(), password=$('#account-password',form).value;
  error.textContent='';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ accountError(screen,'Enter a valid email address.'); return; }
  if (mode==='up' && !name){ accountError(screen,'Enter your name.'); return; }
  if (password.length<6){ accountError(screen,'Use at least 6 characters for the password.'); return; }
  submit.disabled=true;
  submit.textContent=mode==='up'?'Creating account…':'Signing in…';
  try {
    const users=accountUsers();
    let user;
    if (mode==='up'){
      if (users[email]) throw new Error('This email already has an account. Sign in instead.');
      const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
      const id='u'+Array.from(crypto.getRandomValues(new Uint8Array(8)),byte=>byte.toString(16).padStart(2,'0')).join('');
      const hash=await accountPasswordHash(password,salt);
      user={id,name,email,salt,hash};
      users[email]=user;
      localStorage.setItem('eva.users',JSON.stringify(users));
    } else {
      user=users[email];
      if(user?.google) throw new Error('This account uses Google. Continue with Google.');
      if (!user || !user.salt || !user.hash || (await accountPasswordHash(password,user.salt))!==user.hash) throw new Error('The email or password is not right.');
    }
    const session={id:user.id,name:user.name,email:user.email};
    localStorage.setItem('eva.session',JSON.stringify(session));
    finishAccountSignIn(screen,session,mode==='up'?'Account created':'Signed in');
  } catch(err) {
    console.error('[Eva Music] Account operation failed.',err);
    accountError(screen,err instanceof Error?err.message:'Could not save your account. Check browser storage and try again.');
  } finally {
    if (submit.isConnected){ submit.disabled=false; submit.textContent=screen.dataset.mode==='up'?'Create account':'Sign in'; }
  }
});
app.addEventListener('click', e=>{
  let el;
  if (e.target.closest('#seekSvg')) return;
  if ((el = e.target.closest('[data-more]'))){ e.stopPropagation(); const row = el.closest('[data-list]'); const ctx = row ? row.dataset.list : ''; openSheet('track',{id:el.dataset.more, pl: ctx.startsWith('pl:') && !(getPlaylist(ctx.slice(3))||{}).mix ? ctx.slice(3) : ''}); return; }
  if ((el = e.target.closest('.ly'))){ if (el.dataset.t!==undefined) seekTo(+el.dataset.t + S.lyOffset); return; }
  if ((el = e.target.closest('[data-act]'))){ act(el.dataset.act, el); return; }
  if ((el = e.target.closest('[data-go]'))){ go(el.dataset.go); return; }
  if ((el = e.target.closest('[data-play]'))){ const ctx = el.dataset.list; playTrack(el.dataset.play, listFor(ctx), sourceFor(ctx)); return; }
  if ((el = e.target.closest('#mini'))){ S.player = true; render(); return; }
});
app.addEventListener('change', e=>{ if (e.target.id==='customColor') refresh('appearance'); });
app.addEventListener('scroll', e=>{
  const rail=e.target;
  if (!rail || rail.id!=='daily-trend-rail') return;
  const dots=$$('.daily-dot',rail.parentElement);
  let active=0, nearest=Infinity;
  Array.from(rail.children).forEach((card,i)=>{ const distance=Math.abs(card.getBoundingClientRect().left-rail.getBoundingClientRect().left); if(distance<nearest){nearest=distance;active=i;} });
  dots.forEach((dot,i)=>{ dot.classList.toggle('on',i===active); if(i===active) dot.setAttribute('aria-current','true'); else dot.removeAttribute('aria-current'); });
},true);
app.addEventListener('keydown', e=>{ if ((e.key==='Enter'||e.key===' ') && e.target.matches('[role=button]:not(button)')){ e.preventDefault(); e.target.click(); } });
app.addEventListener('input', e=>{
  const t = e.target;
  if (t.id==='setq'){ filterSettings(t.value); }
  else if (t.id==='customColor'){ S.customHex = t.value; S.accent = 'custom'; applyTheme(); saveSettings(); }
  else if (t.id==='offR'){ S.lyOffset = +t.value/10; t.style.setProperty('--p', ((+t.value+30)/60*100)+'%'); $('#offV').textContent = fmtOff(); saveSettings(); }
  else if (t.id==='lysR'){ S.lySize = +t.value; t.style.setProperty('--p', ((+t.value-70)/80*100)+'%'); $('#lysV').textContent = S.lySize+'%'; $('#app').style.setProperty('--lys', (S.lySize/100).toFixed(2)); saveSettings(); }
  else if (t.id==='q'){ S.q = t.value; runSearch(S.q); $('#results').innerHTML = searchResults(); }
  else if (t.id==='energy'){ S.energy = +t.value; t.style.setProperty('--p', t.value+'%'); $('#energyV').textContent = t.value; }
  else if (t.id==='length'){ S.length = +t.value; t.style.setProperty('--p', ((t.value-5)/15*100)+'%'); $('#lengthV').textContent = t.value+' tracks'; }
  else if (t.dataset.eq!==undefined){ const i=+t.dataset.eq; S.eq[i] = +t.value; S.eqPreset='Custom'; const o=$('#eqo'+i); o.textContent = (S.eq[i]>0?'+':'')+S.eq[i]; }
});
/* seek drag */
let dragging = false;
function seekFrom(e){ const sv=$('#seekSvg'); const r=sv.getBoundingClientRect(); const p = clamp((e.clientX-r.left-8)/(r.width-16),0,1); S.pos = p*dur(S.cur); updateTick(); }
function commitSeek(){ if (S.cur && isFinite(S.pos)) audio.currentTime = S.pos; }
app.addEventListener('pointerdown', e=>{ if (e.target.closest('#seekSvg')){ dragging = true; e.target.closest('#seekSvg').setPointerCapture(e.pointerId); seekFrom(e); } });
app.addEventListener('pointermove', e=>{ if (dragging) seekFrom(e); });
const endDrag = ()=>{ if (dragging){ dragging = false; commitSeek(); } };
app.addEventListener('pointerup', endDrag); app.addEventListener('pointercancel', endDrag);
app.addEventListener('keydown', e=>{ if (e.target.id==='seekSvg'){ if(e.key==='ArrowRight') seekTo(S.pos+5); if(e.key==='ArrowLeft') seekTo(S.pos-5); } });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') back(); });
window.addEventListener('resize', ()=>{ if (S.player) drawSeek(); });

/* swipe between tabs when the nav is hidden */
let swx = 0, swy = 0;
screensEl.addEventListener('touchstart', e=>{ const t = e.touches[0]; swx = t.clientX; swy = t.clientY; }, {passive:true});
screensEl.addEventListener('touchend', e=>{
  if (!S.hideTabs || S.stack.length || S.player) return;
  const t = e.changedTouches[0], dx = t.clientX - swx, dy = t.clientY - swy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2){ const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1); if (i >= 0 && i < TABS.length){ S.tab = TABS[i]; render(); } }
}, {passive:true});
document.addEventListener('keydown', e=>{
  if (!S.hideTabs || S.stack.length || S.player || S.sheet || e.target.matches('input,textarea')) return;
  if (e.key==='ArrowRight' || e.key==='ArrowLeft'){ const i = TABS.indexOf(S.tab) + (e.key==='ArrowRight'?1:-1); if (i >= 0 && i < TABS.length){ S.tab = TABS[i]; render(); } }
});

/* ---------- installable app (PWA): icon + manifest generated at runtime ---------- */
function setupApp(){
  const splashLogo = $('#splash img');
  if (splashLogo) splashLogo.src = './eva-music-logo.png';
  const img = new Image();
  img.onload = ()=>{
    try {
      const mk = n => { const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); g.fillStyle = '#141516'; g.fillRect(0,0,n,n);
        const w = n*.64, h = w*img.naturalHeight/img.naturalWidth; g.drawImage(img,(n-w)/2,(n-h)/2,w,h); return c.toDataURL('image/png'); };
      const i192 = mk(192), i512 = mk(512);
      const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (extra) l.sizes = extra; document.head.appendChild(l); };
      add('icon', i192); add('apple-touch-icon', i192);
      const man = {name:'Eva Music', short_name:'Eva Music', description:'Feel the music', start_url:location.pathname+location.search.replace(/[?&]jid=[^&]*/,''), scope:location.pathname.replace(/[^/]*$/,''), display:'standalone', orientation:'portrait', background_color:'#141516', theme_color:'#141516',
        icons:[{src:i192, sizes:'192x192', type:'image/png', purpose:'any maskable'},{src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
      add('manifest', URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'})));
    } catch(e){}
  };
  img.src = LOGO_ICON;
}
/* ---------- boot ---------- */
(function boot(){
  const n = location.hash.slice(1);
  if (n) applyRoute(n);
  loadSettings(); applyTheme(); setupApp();
  try { S.lang = localStorage.getItem('eva.lang') || ''; } catch(e){}
  renderMini(); buildPlayer(); render();
  (async()=>{ await Promise.all([loadLibrary(), loadTrending()]); S.loading = false; refreshAll(); })();
  const sp = $('#splash'), hide = () => sp.classList.add('gone');
  if (n || matchMedia('(prefers-reduced-motion:reduce)').matches) hide(); else { sp.addEventListener('click', hide); setTimeout(hide, 1500); }
})();
})();
