name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'landing page/eva-music-app/package.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Build Web App
        run: |
          cd "landing page/eva-music-app"
          npm install
          npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          cd "landing page/eva-music-app"
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Eva Music" com.santhosh.evamusic --web-dir dist
          npx cap add android
          # Enable cleartext HTTP traffic for media streams if needed
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd "landing page/eva-music-app/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eva-Music-APK
          path: landing page/eva-music-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
